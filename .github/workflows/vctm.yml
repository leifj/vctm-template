name: Update VCTM

# Disabled: registry-cli now handles credential discovery and conversion centrally.
# This workflow is kept for reference only. No GitHub Action is needed.
# See: https://github.com/sirosfoundation/registry-cli
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: sirosfoundation/mtcvctm@v1
        with:
          input-dir: ./credentials
          output-dir: ./vctm
          base-url: https://raw.githubusercontent.com/${{ github.repository }}/vctm
          vctm-branch: vctm
          commit-message: "Update credential metadata files [skip ci]"
          formats: all
          normalize: true
          verbose-rules: true
